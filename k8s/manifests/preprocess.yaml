apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprocess
  labels:
    app: preprocess
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: preprocess
  template:
    metadata:
      labels:
        app: preprocess
    spec:
      containers:
      - name: preprocess
        image: 192.168.100.3:5000/preprocess:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: SERVICE_NAME
          value: "preprocess"
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: TARGET_WIDTH
          value: "640"
        - name: TARGET_HEIGHT
          value: "640"
        - name: JPEG_QUALITY
          value: "85"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: preprocess
spec:
  selector:
    app: preprocess
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
