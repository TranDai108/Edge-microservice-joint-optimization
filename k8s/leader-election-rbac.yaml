# Leader Election RBAC
#
# Grants milp-agent-sa the ability to create/get/update Lease objects in the
# default namespace so that controller pods can run active-standby leader
# election via coordination.k8s.io/v1 Leases (the same mechanism used by
# kube-controller-manager and Cluster-API).
#
# Each controller acquires a dedicated Lease before writing any placement key:
#   milp-agent  → leases/milp-leader
#   drl-agent   → leases/drl-leader
#
# Apply:
#   kubectl apply -f k8s/leader-election-rbac.yaml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election-role
  namespace: default
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leader-election-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: milp-agent-sa
  namespace: default
roleRef:
  kind: Role
  name: leader-election-role
  apiGroup: rbac.authorization.k8s.io
