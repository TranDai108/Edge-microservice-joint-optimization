apiVersion: apps/v1
kind: Deployment
metadata:
  name: twin-sync
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twin-sync
  template:
    metadata:
      labels:
        app: twin-sync
    spec:
      serviceAccountName: twin-sync-sa
      nodeSelector:
        node-role.kubernetes.io/edge: "true"
      containers:
      - name: twin-sync
        image: 192.168.100.3:5000/drl-agent:latest
        imagePullPolicy: Always
        command: ["python", "-m", "drl.twin_sync"]
        args: ["--redis-host", "redis.default.svc.cluster.local", "--redis-port", "6379", "--interval", "15"]
        env:
        - name: REDIS_HOST
          value: redis.default.svc.cluster.local
        - name: REDIS_PORT
          value: "6379"
