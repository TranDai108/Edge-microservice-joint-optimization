apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kltn-node-resource-energy
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kltn-node-resource-energy.json: |
    {
      "uid": "kltn-node-resource-energy",
      "title": "KLTN Cluster Node Resource & Energy",
      "tags": ["kltn", "node", "energy", "kepler"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "node",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(node_cpu_seconds_total{job=\"node-exporter-labeled\",mode=\"idle\"}, node)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1,
            "current": {
              "selected": true,
              "text": "All",
              "value": ".*"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Ready Nodes",
          "datasource": "Prometheus",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "orientation": "auto",
            "textMode": "value"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Avg CPU Utilization (%)",
          "datasource": "Prometheus",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "100 * avg(1 - avg by(node)(rate(node_cpu_seconds_total{job=\"node-exporter-labeled\",mode=\"idle\",node=~\"$node\"}[5m])))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Avg Memory Utilization (%)",
          "datasource": "Prometheus",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "100 * avg(1 - (node_memory_MemAvailable_bytes{job=\"node-exporter-labeled\",node=~\"$node\"} / node_memory_MemTotal_bytes{job=\"node-exporter-labeled\",node=~\"$node\"}))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Avg Node Power (W)",
          "datasource": "Prometheus",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "avg(sum by(instance) (rate(kepler_node_platform_joules_total{instance=~\"$node\"}[5m])))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU Utilization by Node (%)",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - avg by(node)(rate(node_cpu_seconds_total{job=\"node-exporter-labeled\",mode=\"idle\",node=~\"$node\"}[5m])))",
              "legendFormat": "{{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory Utilization by Node (%)",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes{job=\"node-exporter-labeled\",node=~\"$node\"} / node_memory_MemTotal_bytes{job=\"node-exporter-labeled\",node=~\"$node\"}))",
              "legendFormat": "{{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Root Filesystem Utilization by Node (%)",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - (node_filesystem_avail_bytes{job=\"node-exporter-labeled\",node=~\"$node\",mountpoint=\"/\",fstype!~\"tmpfs|overlay|squashfs|rootfs\"} / node_filesystem_size_bytes{job=\"node-exporter-labeled\",node=~\"$node\",mountpoint=\"/\",fstype!~\"tmpfs|overlay|squashfs|rootfs\"}))",
              "legendFormat": "{{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Network Throughput by Node (Mbps)",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(node) (rate(node_network_receive_bytes_total{job=\"node-exporter-labeled\",node=~\"$node\",device!~\"lo|veth.*|cni.*|flannel.*\"}[5m])) * 8 / 1e6",
              "legendFormat": "{{node}} RX"
            },
            {
              "refId": "B",
              "expr": "sum by(node) (rate(node_network_transmit_bytes_total{job=\"node-exporter-labeled\",node=~\"$node\",device!~\"lo|veth.*|cni.*|flannel.*\"}[5m])) * 8 / 1e6",
              "legendFormat": "{{node}} TX"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Mbps"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Node Platform Power by Node (W)",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(instance) (rate(kepler_node_platform_joules_total{instance=~\"$node\"}[60s]))",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Node DRAM Power by Node (W)",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(instance) (rate(kepler_node_dram_joules_total{instance=~\"$node\"}[60s]))",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "CPU Energy Intensity by Node (W/core)",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(instance) (rate(kepler_node_platform_joules_total{instance=~\"$node\"}[60s])) / on(instance) group_left() label_replace(sum by(node) (kube_node_status_allocatable{resource=\"cpu\",unit=\"core\"}), \"instance\", \"$1\", \"node\", \"(.*)\")",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "DRAM Energy Intensity by Node (W/GB)",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(instance) (rate(kepler_node_dram_joules_total{instance=~\"$node\"}[60s])) / on(instance) group_left() (label_replace(sum by(node) (kube_node_status_allocatable{resource=\"memory\",unit=\"byte\"}), \"instance\", \"$1\", \"node\", \"(.*)\") / 1024 / 1024 / 1024)",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            }
          }
        }
      ]
    }
